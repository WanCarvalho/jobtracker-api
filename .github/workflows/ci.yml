# Verificações obrigatórias para pull requests e para a branch main.
# Versões fixadas: Node 24.6.0 (npm 11.5.1), Temurin 21.0.13, Maven 3.9.9 via mvnw,
# Spotless 2.44.3, Prettier 3.9.10 e PostgreSQL 16.4 (Testcontainers).
# Nenhum segredo é usado: as credenciais dos testes são fictícias e efêmeras.
# Configure na branch main a regra de proteção exigindo os jobs "frontend" e "backend".
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Node.js 24.6.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Confirmar versão do npm
        run: test "$(npm --version)" = "11.5.1"

      - name: Instalar dependências
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Build Angular
        run: npm run build

      - name: Publicar build do frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Java 21 (Temurin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Permissão do Maven Wrapper
        run: chmod +x mvnw

      - name: Spotless
        run: ./mvnw -B -ntp spotless:check

      - name: Testes Java (H2 e PostgreSQL via Testcontainers)
        run: ./mvnw -B -ntp verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
